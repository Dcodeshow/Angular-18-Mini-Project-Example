<form [formGroup]="promotersForm" (ngSubmit)="onSubmit()">
  <div formArrayName="promoters">
    <table border="1" cellpadding="6" cellspacing="0" width="100%">
      <thead>
        <tr>
          <th>Name</th>
          <th>Promoter Type</th>
          <th>Address</th>
          <th>Passport Number</th>
          <th>Lie Number</th>
        </tr>
      </thead>

      <tbody>
        <tr
          *ngFor="let promoter of promotersFormArray.controls; let i = index"
          [formGroupName]="i"
        >
          <!-- Name -->
          <td>
            <input formControlName="name" placeholder="Enter name" />
          </td>

          <!-- Promoter Type -->
          <td>
            <select formControlName="promotertypeid">
              <option value="">Select Type</option>
              <option value="individual">Individual</option>
              <option value="company">Company</option>
              <option value="partnership">Partnership</option>
            </select>
          </td>

          <!-- Address -->
          <td>
            <input formControlName="address" placeholder="Enter address" />
          </td>

          <!-- Passport Number (only for Individual) -->
          <td>
            <ng-container *ngIf="isIndividualSelected(i)">
              <input
                formControlName="passportnumber"
                placeholder="Enter passport number"
              />
            </ng-container>
          </td>

          <!-- Lie Number (only for Company) -->
          <td>
            <ng-container *ngIf="isCompanySelected(i)">
              <input
                formControlName="lienumber"
                placeholder="Enter lie number"
              />
              <div
                class="error"
                *ngIf="
                  promoter.get('lienumber')?.touched &&
                  promoter.get('lienumber')?.hasError('required')
                "
              >
                Lie Number is required for company promoters
              </div>
            </ng-container>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <br />

  <button type="button" (click)="addPromoter()">Add Promoter</button>
  <button type="submit">Submit</button>
</form>
