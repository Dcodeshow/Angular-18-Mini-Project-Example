<form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-3">
  <mat-checkbox
    [checked]="selectAllChecked"
    (change)="toggleSelectAll($event)"
    color="primary"
  >
    Select All
  </mat-checkbox>

  <div class="mt-3">
    <ng-container *ngFor="let merchant of IssuesList">
      <mat-checkbox
        [checked]="merchant.checked"
        (change)="onSingleSelect(merchant, $event)"
      >
        {{ merchant.text }}
      </mat-checkbox>
    </ng-container>
  </div>

  <button
    mat-raised-button
    color="primary"
    type="submit"
    class="mt-4"
    [disabled]="!checkedAll"
  >
    Submit
  </button>
</form>
